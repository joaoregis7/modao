    <script>
      // Prevent extensions from throwing "Cannot set property fetch of #<Window> which has only a getter"
      try {
        if (typeof window !== 'undefined') {
          var _rawFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return _rawFetch; },
            set: function(fn) { _rawFetch = fn; }
          });
        }
      } catch (e) {
        /* ignore */
      }
    </script>
